###############################################################################
#                      GO-EUC NUTANIX COLLECTOR (WINDOWS)                     #
###############################################################################

# Collects Nutanix host metrics from the Prism Element v2.0 REST API (one metric per host).
# Use the cluster's Prism Element address (cluster virtual IP), not Prism Central.
# Alternative: run this collector on the appliance itself from the landing page
# (Infrastructure collectors > Nutanix Prism Element); no Windows machine needed.
#
# Set <<NUTANIX_PRISM_ELEMENT_ADDRESS>>, <<NUTANIX_USERNAME>> and <<NUTANIX_PASSWORD>> below.

[global_tags]


# Configuration for telegraf agent
[agent]
    interval = "10s"
    debug = false
    round_interval = true
    flush_interval = "10s"
    flush_jitter = "0s"
    collection_jitter = "0s"
    metric_batch_size = 1000
    metric_buffer_limit = 10000
    quiet = false
    logfile = "C:\\Windows\\Temp\\telegraf.log"
    logfile_rotation_interval = "0"
    logfile_rotation_max_size = "0"
    logfile_rotation_max_archives = 3
    omit_hostname = false

###############################################################################
#                                   OUTPUTS                                   #
###############################################################################

[[outputs.influxdb_v2]]
    urls = ["<<TELEGRAF_URL>>"]
    organization = "<<TELEGRAF_ORGANISATION>>"
    bucket = "Performance"
    token = "<<TELEGRAF_TOKEN>>"
    # true while the appliance uses its self-signed certificate; set to false
    # automatically once a Let's Encrypt certificate is active.
    insecure_skip_verify = <<TELEGRAF_INSECURE_SKIP_VERIFY>>

###############################################################################
#                                    INPUTS                                   #
###############################################################################

[[inputs.http]]
  urls = ["https://<<NUTANIX_PRISM_ELEMENT_ADDRESS>>:9440/api/nutanix/v2.0/hosts/"]
  method = "GET"
  username = "<<NUTANIX_USERNAME>>"
  password = "<<NUTANIX_PASSWORD>>"
  interval = "5s"
  timeout = "15s"
  insecure_skip_verify = true
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    measurement_name = "nutanix_host"

    # One metric per host: every element of entities[] (not only the first host).
    # Nested keys are flattened with underscores, e.g. stats.hypervisor_num_iops
    # becomes stats_hypervisor_num_iops.
    [[inputs.http.json_v2.object]]
      path = "entities"
      tags = ["name", "uuid", "hypervisor_address"]
      included_keys = [
        "name",
        "uuid",
        "hypervisor_address",
        "num_vms",
        "num_cpu_cores",
        "memory_capacity_in_bytes",
        "oplog_disk_pct",
        "stats_hypervisor_cpu_usage_ppm",
        "stats_hypervisor_memory_usage_ppm",
        "stats_hypervisor_num_iops",
        "stats_hypervisor_io_bandwidth_kBps",
        "stats_hypervisor_avg_io_latency_usecs",
        "stats_controller_num_iops",
        "stats_controller_io_bandwidth_kBps",
        "stats_controller_avg_io_latency_usecs",
        "stats_controller_read_io_bandwidth_kBps",
        "stats_controller_write_io_bandwidth_kBps",
        "stats_hypervisor_num_received_bytes",
        "stats_hypervisor_num_transmitted_bytes",
        "stats_hypervisor_timespan_usecs",
        "usage_stats_storage.capacity_bytes",
        "usage_stats_storage.usage_bytes",
        "usage_stats_storage.free_bytes",
        "usage_stats_storage.logical_usage_bytes",
      ]

      [inputs.http.json_v2.object.renames]
        # Host identity (tags)
        name = "host"
        uuid = "host_uuid"
        hypervisor_address = "hypervisor_ip"
        # Configuration
        num_vms = "vm_count"
        num_cpu_cores = "cpu_cores"
        memory_capacity_in_bytes = "memory_capacity_bytes"
        oplog_disk_pct = "oplog_usage_pct"
        # CPU and memory (parts per million)
        stats_hypervisor_cpu_usage_ppm = "cpu_usage_ppm"
        stats_hypervisor_memory_usage_ppm = "memory_usage_ppm"
        # Hypervisor storage
        stats_hypervisor_num_iops = "hypervisor_iops"
        stats_hypervisor_io_bandwidth_kBps = "hypervisor_io_kBps"
        stats_hypervisor_avg_io_latency_usecs = "hypervisor_io_latency_us"
        # Nutanix controller storage
        stats_controller_num_iops = "controller_iops"
        stats_controller_io_bandwidth_kBps = "controller_io_kBps"
        stats_controller_avg_io_latency_usecs = "controller_io_latency_us"
        stats_controller_read_io_bandwidth_kBps = "controller_read_kBps"
        stats_controller_write_io_bandwidth_kBps = "controller_write_kBps"
        # Network interval counters
        stats_hypervisor_num_received_bytes = "network_received_bytes"
        stats_hypervisor_num_transmitted_bytes = "network_transmitted_bytes"
        stats_hypervisor_timespan_usecs = "sample_timespan_us"
        # Storage capacity
        "usage_stats_storage.capacity_bytes" = "storage_capacity_bytes"
        "usage_stats_storage.usage_bytes" = "storage_used_bytes"
        "usage_stats_storage.free_bytes" = "storage_free_bytes"
        "usage_stats_storage.logical_usage_bytes" = "storage_logical_used_bytes"

      # Nutanix v2.0 returns most stats as strings: convert them to numbers.
      [inputs.http.json_v2.object.fields]
        num_vms = "int"
        num_cpu_cores = "int"
        memory_capacity_in_bytes = "uint"
        oplog_disk_pct = "float"
        stats_hypervisor_cpu_usage_ppm = "float"
        stats_hypervisor_memory_usage_ppm = "float"
        stats_hypervisor_num_iops = "float"
        stats_hypervisor_io_bandwidth_kBps = "float"
        stats_hypervisor_avg_io_latency_usecs = "float"
        stats_controller_num_iops = "float"
        stats_controller_io_bandwidth_kBps = "float"
        stats_controller_avg_io_latency_usecs = "float"
        stats_controller_read_io_bandwidth_kBps = "float"
        stats_controller_write_io_bandwidth_kBps = "float"
        stats_hypervisor_num_received_bytes = "float"
        stats_hypervisor_num_transmitted_bytes = "float"
        stats_hypervisor_timespan_usecs = "float"
        "usage_stats_storage.capacity_bytes" = "float"
        "usage_stats_storage.usage_bytes" = "float"
        "usage_stats_storage.free_bytes" = "float"
        "usage_stats_storage.logical_usage_bytes" = "float"

###############################################################################
#                                  PROCESSORS                                 #
###############################################################################

# Safety net: Nutanix v2.0 returns most stats as strings. Convert the renamed fields to
# numbers here as well, so types are right whatever json_v2 did with them.
[[processors.converter]]
  namepass = ["nutanix_host"]
  order = 1
  [processors.converter.fields]
    integer = ["vm_count", "cpu_cores"]
    unsigned = ["memory_capacity_bytes"]
    float = ["oplog_usage_pct", "cpu_usage_ppm", "memory_usage_ppm", "hypervisor_iops", "hypervisor_io_kBps", "hypervisor_io_latency_us", "controller_iops", "controller_io_kBps", "controller_io_latency_us", "controller_read_kBps", "controller_write_kBps", "network_received_bytes", "network_transmitted_bytes", "sample_timespan_us", "storage_capacity_bytes", "storage_used_bytes", "storage_free_bytes", "storage_logical_used_bytes"]

[[processors.starlark]]
  namepass = ["nutanix_host"]
  order = 2

  source = '''
def apply(metric):
    fields = metric.fields

    # Nutanix reports utilisation in parts per million.
    if "cpu_usage_ppm" in fields:
        fields["cpu_usage_pct"] = float(fields["cpu_usage_ppm"]) / 10000.0

    if "memory_usage_ppm" in fields:
        fields["memory_usage_pct"] = float(fields["memory_usage_ppm"]) / 10000.0

    # Calculate memory currently used.
    if "memory_usage_pct" in fields and "memory_capacity_bytes" in fields:
        memory_pct = float(fields["memory_usage_pct"])
        memory_capacity = float(fields["memory_capacity_bytes"])
        fields["memory_used_bytes"] = memory_capacity * memory_pct / 100.0

    # Calculate Nutanix storage utilisation.
    if "storage_used_bytes" in fields and "storage_capacity_bytes" in fields:
        storage_used = float(fields["storage_used_bytes"])
        storage_capacity = float(fields["storage_capacity_bytes"])

        if storage_capacity > 0:
            fields["storage_usage_pct"] = storage_used / storage_capacity * 100.0

    # Nutanix returns network bytes transferred during the sample timespan.
    if "sample_timespan_us" in fields:
        sample_seconds = float(fields["sample_timespan_us"]) / 1000000.0

        if sample_seconds > 0:
            if "network_received_bytes" in fields:
                received = float(fields["network_received_bytes"])
                fields["network_receive_Bps"] = received / sample_seconds

            if "network_transmitted_bytes" in fields:
                transmitted = float(fields["network_transmitted_bytes"])
                fields["network_transmit_Bps"] = transmitted / sample_seconds

    return metric
'''

###############################################################################
#                                 AGGREGATORS                                 #
###############################################################################
