###############################################################################
#                    GO-EUC PROXMOX VE COLLECTOR (WINDOWS)                    #
###############################################################################

# Collects Proxmox VE metrics over the Proxmox API.
# Alternative: run this collector on the appliance itself from the landing page
# (Infrastructure collectors > Proxmox VE): it discovers every node automatically.
#
# Set <<PROXMOX_ADDRESS>>, <<PROXMOX_TOKEN_ID>> (user@realm!tokenname),
# <<PROXMOX_TOKEN_SECRET>> and <<PROXMOX_NODE>> below. For a cluster, copy the
# "Proxmox node" section once per node. The token needs the PVEAuditor role on /.

[global_tags]


# Configuration for telegraf agent
[agent]
    interval = "10s"
    debug = false
    round_interval = true
    flush_interval = "10s"
    flush_jitter = "0s"
    collection_jitter = "0s"
    metric_batch_size = 1000
    metric_buffer_limit = 10000
    quiet = false
    logfile = "C:\\Windows\\Temp\\telegraf.log"
    logfile_rotation_interval = "0"
    logfile_rotation_max_size = "0"
    logfile_rotation_max_archives = 3
    omit_hostname = false

###############################################################################
#                                   OUTPUTS                                   #
###############################################################################

[[outputs.influxdb_v2]]
    urls = ["<<TELEGRAF_URL>>"]
    organization = "<<TELEGRAF_ORGANISATION>>"
    bucket = "Performance"
    token = "<<TELEGRAF_TOKEN>>"
    # true while the appliance uses its self-signed certificate; set to false
    # automatically once a Let's Encrypt certificate is active.
    insecure_skip_verify = <<TELEGRAF_INSECURE_SKIP_VERIFY>>

###############################################################################
#                                    INPUTS                                   #
###############################################################################

# Cluster-wide: every node, VM, LXC container and storage in one call
# (CPU, memory, disk, network and disk I/O counters, uptime).
[[inputs.http]]
  urls = ["https://<<PROXMOX_ADDRESS>>:8006/api2/json/cluster/resources"]
  method = "GET"
  headers = { Authorization = "PVEAPIToken=<<PROXMOX_TOKEN_ID>>=<<PROXMOX_TOKEN_SECRET>>" }
  interval = "10s"
  timeout = "15s"
  insecure_skip_verify = true
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    measurement_name = "proxmox_resource"
    [[inputs.http.json_v2.object]]
      path = "data"
      tags = ["id", "type", "node", "name", "vmid", "status", "storage", "pool", "hastate", "plugintype"]
      included_keys = ["cpu", "maxcpu", "mem", "maxmem", "disk", "maxdisk", "netin", "netout", "diskread", "diskwrite", "uptime"]
      [inputs.http.json_v2.object.fields]
        cpu = "float"
        maxcpu = "float"
        mem = "float"
        maxmem = "float"
        disk = "float"
        maxdisk = "float"
        netin = "float"
        netout = "float"
        diskread = "float"
        diskwrite = "float"
        uptime = "float"

# Cluster membership and quorum (also works on a standalone node).
[[inputs.http]]
  urls = ["https://<<PROXMOX_ADDRESS>>:8006/api2/json/cluster/status"]
  method = "GET"
  headers = { Authorization = "PVEAPIToken=<<PROXMOX_TOKEN_ID>>=<<PROXMOX_TOKEN_SECRET>>" }
  interval = "30s"
  timeout = "15s"
  insecure_skip_verify = true
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    measurement_name = "proxmox_cluster"
    [[inputs.http.json_v2.object]]
      path = "data"
      tags = ["type", "id", "name", "ip"]
      included_keys = ["nodes", "quorate", "version", "online", "local", "nodeid"]
      [inputs.http.json_v2.object.fields]
        nodes = "int"
        quorate = "int"
        version = "int"
        online = "int"
        local = "int"
        nodeid = "int"

###############################################################################
# Proxmox node: <<PROXMOX_NODE>>
###############################################################################

# VMs and LXC containers on this node (Telegraf proxmox plugin: status, CPU load,
# memory, swap, disk usage, disk read/write and network bytes per guest).
[[inputs.proxmox]]
  base_url = "https://<<PROXMOX_ADDRESS>>:8006/api2/json"
  api_token = "<<PROXMOX_TOKEN_ID>>=<<PROXMOX_TOKEN_SECRET>>"
  node_name = "<<PROXMOX_NODE>>"
  additional_vmstats_tags = ["vmid", "status"]
  insecure_skip_verify = true
  response_timeout = "15s"

# Node status: CPU, iowait, load averages, memory, swap, root filesystem, KSM, uptime, CPU info.
[[inputs.http]]
  urls = ["https://<<PROXMOX_ADDRESS>>:8006/api2/json/nodes/<<PROXMOX_NODE>>/status"]
  method = "GET"
  headers = { Authorization = "PVEAPIToken=<<PROXMOX_TOKEN_ID>>=<<PROXMOX_TOKEN_SECRET>>" }
  interval = "10s"
  timeout = "15s"
  insecure_skip_verify = true
  data_format = "json_v2"

  [inputs.http.tags]
    node = "<<PROXMOX_NODE>>"

  [[inputs.http.json_v2]]
    measurement_name = "proxmox_node"

    [[inputs.http.json_v2.tag]]
      path = "data.pveversion"
      rename = "pve_version"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.cpu"
      rename = "cpu"
      type = "float"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.wait"
      rename = "iowait"
      type = "float"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.idle"
      rename = "idle"
      type = "float"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.loadavg.0"
      rename = "load1"
      type = "float"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.loadavg.1"
      rename = "load5"
      type = "float"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.loadavg.2"
      rename = "load15"
      type = "float"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.memory.total"
      rename = "memory_total"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.memory.used"
      rename = "memory_used"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.memory.free"
      rename = "memory_free"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.memory.available"
      rename = "memory_available"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.swap.total"
      rename = "swap_total"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.swap.used"
      rename = "swap_used"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.swap.free"
      rename = "swap_free"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.rootfs.total"
      rename = "rootfs_total"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.rootfs.used"
      rename = "rootfs_used"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.rootfs.free"
      rename = "rootfs_free"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.rootfs.avail"
      rename = "rootfs_avail"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.ksm.shared"
      rename = "ksm_shared"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.uptime"
      rename = "uptime"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.cpuinfo.cpus"
      rename = "cpu_threads"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.cpuinfo.cores"
      rename = "cpu_cores"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.cpuinfo.sockets"
      rename = "cpu_sockets"
      type = "int"
      optional = true

    [[inputs.http.json_v2.field]]
      path = "data.cpuinfo.mhz"
      rename = "cpu_mhz"
      type = "float"
      optional = true

# Node history at 1-minute resolution (last hour, re-read every minute; points are
# timestamped so re-reads overwrite rather than duplicate): adds node network
# throughput, ZFS ARC size and pressure stall information.
[[inputs.http]]
  urls = ["https://<<PROXMOX_ADDRESS>>:8006/api2/json/nodes/<<PROXMOX_NODE>>/rrddata?timeframe=hour&cf=AVERAGE"]
  method = "GET"
  headers = { Authorization = "PVEAPIToken=<<PROXMOX_TOKEN_ID>>=<<PROXMOX_TOKEN_SECRET>>" }
  interval = "60s"
  timeout = "30s"
  insecure_skip_verify = true
  data_format = "json_v2"

  [inputs.http.tags]
    node = "<<PROXMOX_NODE>>"

  [[inputs.http.json_v2]]
    measurement_name = "proxmox_node_rrd"
    [[inputs.http.json_v2.object]]
      path = "data"
      timestamp_key = "time"
      timestamp_format = "unix"
      included_keys = ["cpu", "maxcpu", "iowait", "loadavg", "memtotal", "memused", "swaptotal", "swapused", "roottotal", "rootused", "netin", "netout", "arcsize", "pressurecpusome", "pressureiosome", "pressureiofull", "pressurememorysome", "pressurememoryfull"]
      [inputs.http.json_v2.object.fields]
        cpu = "float"
        maxcpu = "float"
        iowait = "float"
        loadavg = "float"
        memtotal = "float"
        memused = "float"
        swaptotal = "float"
        swapused = "float"
        roottotal = "float"
        rootused = "float"
        netin = "float"
        netout = "float"
        arcsize = "float"
        pressurecpusome = "float"
        pressureiosome = "float"
        pressureiofull = "float"
        pressurememorysome = "float"
        pressurememoryfull = "float"

###############################################################################
#                                  PROCESSORS                                 #
###############################################################################

[[processors.starlark]]
  namepass = ["proxmox_node", "proxmox_resource"]

  source = '''
def pct(fields, used, total, out):
    if used in fields and total in fields and float(fields[total]) > 0:
        fields[out] = float(fields[used]) / float(fields[total]) * 100.0

def apply(metric):
    fields = metric.fields

    # Proxmox reports CPU and iowait as fractions (0..1).
    if "cpu" in fields:
        fields["cpu_usage_pct"] = float(fields["cpu"]) * 100.0

    if metric.name == "proxmox_node":
        if "iowait" in fields:
            fields["iowait_pct"] = float(fields["iowait"]) * 100.0
        pct(fields, "memory_used", "memory_total", "memory_used_pct")
        pct(fields, "swap_used", "swap_total", "swap_used_pct")
        pct(fields, "rootfs_used", "rootfs_total", "rootfs_used_pct")
    else:
        pct(fields, "mem", "maxmem", "mem_used_pct")
        pct(fields, "disk", "maxdisk", "disk_used_pct")

    return metric
'''

###############################################################################
#                                 AGGREGATORS                                 #
###############################################################################
