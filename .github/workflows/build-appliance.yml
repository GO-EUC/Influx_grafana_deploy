name: Build Virtual Appliance

# Pushes to dev and main build the appliance and upload the images (main also publishes the
# dashboard bundle). GitHub Releases are only created when you ask for one: run this workflow
# by hand on main (Actions > Build Virtual Appliance > Run workflow) with "Create release"
# ticked. See docs/development.md, "Releasing".

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with this build's download links (main branch only)"
        type: boolean
        default: false
      release_type:
        description: "Version bump: major (new functionality, v1.4 -> v2.0) or minor (fixes, v2.0 -> v2.1)"
        type: choice
        options:
          - minor
          - major
        default: minor
      release_notes:
        description: "Optional text for the top of the release notes (a list of changes is added automatically)"
        type: string
        required: false

permissions:
  contents: write
  id-token: write

# Never run two builds of the same branch at once (two releases could pick the same version).
concurrency:
  group: build-appliance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: appliance-build
    env:
      RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release checks run first so a bad request fails in seconds, not after the build.
      - name: Check release request
        if: env.RELEASE_REQUESTED == 'true'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Releases can only be created from main (this run is on '${GITHUB_REF_NAME}'). Merge into main, then run the workflow on main with 'Create release' ticked."
            exit 1
          fi

      - name: Work out release version
        if: env.RELEASE_REQUESTED == 'true'
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          git fetch --tags --force
          LATEST_TAG="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [[ -z "${LATEST_TAG}" ]]; then
            NEXT_TAG="v1.0"
          else
            VERSION_NO_V="${LATEST_TAG#v}"
            MAJOR="${VERSION_NO_V%%.*}"
            MINOR="${VERSION_NO_V##*.}"
            if [[ "${RELEASE_TYPE}" == "major" ]]; then
              NEXT_TAG="v$((MAJOR + 1)).0"
            else
              NEXT_TAG="v${MAJOR}.$((MINOR + 1))"
            fi
          fi
          if git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null; then
            echo "::error::Tag ${NEXT_TAG} already exists; refusing to overwrite a release."
            exit 1
          fi
          echo "Release ${NEXT_TAG} (${RELEASE_TYPE}; previous: ${LATEST_TAG:-none})"
          echo "release_tag=${NEXT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools qemu-utils passt

      - name: Build appliance images (OVA + VHD)
        env:
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_DEBUG: "1"
          LIBGUESTFS_TRACE: "1"
          VIRT_CUSTOMIZE_DEBUG: "true"
          VIRT_CUSTOMIZE_NO_NETWORK: "true"
          USE_SUDO_FOR_VIRT_CUSTOMIZE: "true"
          # Bake the dashboard bundle location (published below on main) into the image.
          DASHBOARDS_ZIP_URL: ${{ vars.AZURE_STORAGE_ACCOUNT && format('https://{0}.blob.core.windows.net/files/Dashboards.zip', vars.AZURE_STORAGE_ACCOUNT) || '' }}
        run: bash appliance/build-appliance.sh

      - name: Capture artifact paths
        id: files
        run: |
          OVA_FILE="$(ls -1 dist/*.ova | tail -n1)"
          OVA_CHECKSUM_FILE="${OVA_FILE}.sha256"
          VHD_FILE="$(ls -1 dist/*.vhd | tail -n1)"
          VHD_CHECKSUM_FILE="${VHD_FILE}.sha256"

          echo "ova_file=${OVA_FILE}" >> "${GITHUB_OUTPUT}"
          echo "ova_checksum_file=${OVA_CHECKSUM_FILE}" >> "${GITHUB_OUTPUT}"
          echo "ova_name=$(basename "${OVA_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "ova_checksum_name=$(basename "${OVA_CHECKSUM_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "ova_sha256=$(cut -d' ' -f1 "${OVA_CHECKSUM_FILE}")" >> "${GITHUB_OUTPUT}"

          echo "vhd_file=${VHD_FILE}" >> "${GITHUB_OUTPUT}"
          echo "vhd_checksum_file=${VHD_CHECKSUM_FILE}" >> "${GITHUB_OUTPUT}"
          echo "vhd_name=$(basename "${VHD_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "vhd_checksum_name=$(basename "${VHD_CHECKSUM_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "vhd_sha256=$(cut -d' ' -f1 "${VHD_CHECKSUM_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Azure Login (OIDC)
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload appliance images to Azure Blob
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        run: |
          az storage blob upload \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.AZURE_STORAGE_CONTAINER }}" \
            --name "${{ steps.files.outputs.ova_name }}" \
            --file "${{ steps.files.outputs.ova_file }}" \
            --auth-mode login \
            --overwrite true

          az storage blob upload \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.AZURE_STORAGE_CONTAINER }}" \
            --name "${{ steps.files.outputs.ova_checksum_name }}" \
            --file "${{ steps.files.outputs.ova_checksum_file }}" \
            --auth-mode login \
            --overwrite true

          az storage blob upload \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.AZURE_STORAGE_CONTAINER }}" \
            --name "${{ steps.files.outputs.vhd_name }}" \
            --file "${{ steps.files.outputs.vhd_file }}" \
            --auth-mode login \
            --overwrite true

          az storage blob upload \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.AZURE_STORAGE_CONTAINER }}" \
            --name "${{ steps.files.outputs.vhd_checksum_name }}" \
            --file "${{ steps.files.outputs.vhd_checksum_file }}" \
            --auth-mode login \
            --overwrite true

      - name: Publish dashboard bundle to Azure Blob
        if: github.ref_name == 'main'
        run: |
          # Appliances fetch this file during "Run Full Appliance Update", so it must
          # match the Dashboards.zip in the released commit.
          az storage blob upload \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "files" \
            --name "Dashboards.zip" \
            --file "Dashboards.zip" \
            --auth-mode login \
            --overwrite true

      - name: Show download URLs
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        env:
          BASE: https://${{ vars.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ vars.AZURE_STORAGE_CONTAINER }}
        run: |
          {
            echo "### Appliance images"
            echo ""
            echo "| Image | Download | SHA-256 |"
            echo "|---|---|---|"
            echo "| OVA | ${BASE}/${{ steps.files.outputs.ova_name }} | \`${{ steps.files.outputs.ova_sha256 }}\` |"
            echo "| VHD | ${BASE}/${{ steps.files.outputs.vhd_name }} | \`${{ steps.files.outputs.vhd_sha256 }}\` |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Write release notes
        if: env.RELEASE_REQUESTED == 'true'
        env:
          # Passed through the environment, never pasted into the script (script injection).
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          TAG: ${{ steps.version.outputs.release_tag }}
          PREVIOUS: ${{ steps.version.outputs.previous_tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE: https://${{ vars.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ vars.AZURE_STORAGE_CONTAINER }}
          OVA_NAME: ${{ steps.files.outputs.ova_name }}
          OVA_SHA: ${{ steps.files.outputs.ova_sha256 }}
          VHD_NAME: ${{ steps.files.outputs.vhd_name }}
          VHD_SHA: ${{ steps.files.outputs.vhd_sha256 }}
        run: |
          {
            if [[ -n "${RELEASE_NOTES_INPUT}" ]]; then
              printf '%s\n\n' "${RELEASE_NOTES_INPUT}"
            fi
            echo "## Download"
            echo ""
            echo "| Image | Use it for | Download | SHA-256 |"
            echo "|---|---|---|---|"
            echo "| OVA | VMware vSphere / ESXi | [${OVA_NAME}](${BASE}/${OVA_NAME}) ([checksum](${BASE}/${OVA_NAME}.sha256)) | \`${OVA_SHA}\` |"
            echo "| VHD | Hyper-V, Nutanix AHV, Proxmox VE / KVM | [${VHD_NAME}](${BASE}/${VHD_NAME}) ([checksum](${BASE}/${VHD_NAME}.sha256)) | \`${VHD_SHA}\` |"
            echo ""
            echo "## Getting started"
            echo ""
            echo "- **New to the appliance:** [Getting started](${REPO_URL}/blob/${TAG}/docs/getting-started.md): requirements, import on each hypervisor, setup, first login."
            echo "- **Upgrading from an earlier release:** deploy this release as a new appliance, then run \`sudo go-euc-migrate <old-appliance-ip>\` on it. See [Switching appliances](${REPO_URL}/blob/${TAG}/docs/switching-appliances.md)."
            echo "- **What's new:** [CHANGELOG](${REPO_URL}/blob/${TAG}/CHANGELOG.md)."
            if [[ -n "${PREVIOUS}" ]]; then
              echo "- **All changes since ${PREVIOUS}:** [compare](${REPO_URL}/compare/${PREVIOUS}...${TAG})."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        if: env.RELEASE_REQUESTED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: GO-EUC Appliance ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          # Appends GitHub's generated list of merged pull requests and contributors.
          generate_release_notes: true
          make_latest: true
