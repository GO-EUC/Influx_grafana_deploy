# GO-EUC appliance vSphere collector.
#
# Runs in the "telegraf-vsphere" container managed by /usr/local/bin/go-euc-collector.sh
# and configured from the appliance web page (Infrastructure collectors > VMware vSphere).
# This file holds no secrets: the environment variable references (dollar-brace) are filled
# from the container environment
# (/etc/go-euc/telegraf-vsphere.env, root-only, generated from /etc/go-euc/collector-vsphere.env).

[agent]
  interval = "20s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  # The container hostname is meaningless; vSphere metrics carry vcenter/host/vm tags.
  omit_hostname = true

[[outputs.influxdb_v2]]
  # Same InfluxDB base path nginx proxies to (/influx), over the internal Docker network.
  urls = ["http://influxdb:8086/influx"]
  organization = "${INFLUX_ORG}"
  bucket = "Performance"
  token = "${INFLUX_TOKEN}"

# Realtime statistics (VMs and ESXi hosts): vCenter samples these every 20 seconds.
[[inputs.vsphere]]
  interval = "20s"
  vcenters = ["${COLLECTOR_URL}"]
  username = "${COLLECTOR_USERNAME}"
  password = "${COLLECTOR_PASSWORD}"
  insecure_skip_verify = ${COLLECTOR_INSECURE_SKIP_VERIFY}
  timeout = "60s"
  cluster_metric_exclude = ["*"]
  datastore_metric_exclude = ["*"]
  datacenter_metric_exclude = ["*"]

# Historical statistics (clusters, datastores, datacenters): vCenter only aggregates these
# every 5 minutes, so they are collected separately at that interval.
[[inputs.vsphere]]
  interval = "300s"
  vcenters = ["${COLLECTOR_URL}"]
  username = "${COLLECTOR_USERNAME}"
  password = "${COLLECTOR_PASSWORD}"
  insecure_skip_verify = ${COLLECTOR_INSECURE_SKIP_VERIFY}
  timeout = "120s"
  vm_metric_exclude = ["*"]
  host_metric_exclude = ["*"]
  max_query_metrics = 256
