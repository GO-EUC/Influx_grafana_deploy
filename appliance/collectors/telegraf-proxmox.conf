# GO-EUC appliance Proxmox VE collector.
#
# Runs in the "telegraf-proxmox" container managed by /usr/local/bin/go-euc-collector.sh
# and configured from the appliance web page (Infrastructure collectors > Proxmox VE).
# The final config is rendered at apply time: the per-node section
# (telegraf-proxmox-node.conf.part) is repeated for every node returned by /api2/json/nodes.
# This file holds no secrets: the environment variable references (dollar-brace) are filled
# from the container environment; @@INSECURE_SKIP_VERIFY@@ is filled in when the collector starts
# (/etc/go-euc/telegraf-proxmox.env, root-only, generated from /etc/go-euc/collector-proxmox.env).
#
# Measurements: proxmox (per VM/LXC), proxmox_node, proxmox_node_rrd, proxmox_resource,
# proxmox_cluster. API token needs the PVEAuditor role on /.

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  # The container hostname is meaningless; Proxmox metrics carry node/vm tags.
  omit_hostname = true

[[outputs.influxdb_v2]]
  # InfluxDB directly over the internal Docker network (no /influx prefix: that is nginx-only).
  urls = ["http://influxdb:8086"]
  organization = "${INFLUX_ORG}"
  bucket = "Performance"
  token = "${INFLUX_TOKEN}"

# Cluster-wide: every node, VM, LXC container and storage in one call
# (CPU, memory, disk, network and disk I/O counters, uptime).
[[inputs.http]]
  urls = ["${COLLECTOR_URL}/api2/json/cluster/resources"]
  method = "GET"
  headers = { Authorization = "PVEAPIToken=${COLLECTOR_USERNAME}=${COLLECTOR_PASSWORD}" }
  interval = "10s"
  timeout = "15s"
  insecure_skip_verify = @@INSECURE_SKIP_VERIFY@@
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    measurement_name = "proxmox_resource"
    [[inputs.http.json_v2.object]]
      path = "data"
      tags = ["id", "type", "node", "name", "vmid", "status", "storage", "pool", "hastate", "plugintype"]
      included_keys = ["cpu", "maxcpu", "mem", "maxmem", "disk", "maxdisk", "netin", "netout", "diskread", "diskwrite", "uptime"]
      [inputs.http.json_v2.object.fields]
        cpu = "float"
        maxcpu = "float"
        mem = "float"
        maxmem = "float"
        disk = "float"
        maxdisk = "float"
        netin = "float"
        netout = "float"
        diskread = "float"
        diskwrite = "float"
        uptime = "float"

# Cluster membership and quorum (also works on a standalone node).
[[inputs.http]]
  urls = ["${COLLECTOR_URL}/api2/json/cluster/status"]
  method = "GET"
  headers = { Authorization = "PVEAPIToken=${COLLECTOR_USERNAME}=${COLLECTOR_PASSWORD}" }
  interval = "30s"
  timeout = "15s"
  insecure_skip_verify = @@INSECURE_SKIP_VERIFY@@
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    measurement_name = "proxmox_cluster"
    [[inputs.http.json_v2.object]]
      path = "data"
      tags = ["type", "id", "name", "ip"]
      included_keys = ["nodes", "quorate", "version", "online", "local", "nodeid"]
      [inputs.http.json_v2.object.fields]
        nodes = "int"
        quorate = "int"
        version = "int"
        online = "int"
        local = "int"
        nodeid = "int"

# @@PER_NODE_INPUTS@@

[[processors.starlark]]
  namepass = ["proxmox_node", "proxmox_resource"]

  source = '''
def pct(fields, used, total, out):
    if used in fields and total in fields and float(fields[total]) > 0:
        fields[out] = float(fields[used]) / float(fields[total]) * 100.0

def apply(metric):
    fields = metric.fields

    # Proxmox reports CPU and iowait as fractions (0..1).
    if "cpu" in fields:
        fields["cpu_usage_pct"] = float(fields["cpu"]) * 100.0

    if metric.name == "proxmox_node":
        if "iowait" in fields:
            fields["iowait_pct"] = float(fields["iowait"]) * 100.0
        pct(fields, "memory_used", "memory_total", "memory_used_pct")
        pct(fields, "swap_used", "swap_total", "swap_used_pct")
        pct(fields, "rootfs_used", "rootfs_total", "rootfs_used_pct")
    else:
        pct(fields, "mem", "maxmem", "mem_used_pct")
        pct(fields, "disk", "maxdisk", "disk_used_pct")

    return metric
'''
